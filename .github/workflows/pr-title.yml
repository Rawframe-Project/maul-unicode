# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@9f232b058d1cc607fc555945e27fd55e9edcd460 # main
    with:
      scopes: encoding properties segment line bidi script normalize case identifier security harfbuzz generator tables build bench family
