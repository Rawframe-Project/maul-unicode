# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer. docs/operations/checks.md
# explains each job; tools/check.sh runs the same checks locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # apt retries a stalled download and gives up on a dead one.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
  PREFIX: MAUL_UNICODE

jobs:
  # The organization's documentation check; tools/ucd holds the Unicode
  # data, kept exactly as published.
  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@main
    with:
      exclude: tools/ucd

  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build libharfbuzz-dev pkg-config
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: The documentation site builds
        run: |
          pip install markdown==3.6 >/dev/null
          python3 tools/build_docs.py
      - name: Generated tables match the generator
        run: |
          cmake -B build-gen -G Ninja -DCMAKE_C_COMPILER=clang-20 -DMAUL_UNICODE_BUILD_TESTS=OFF
          cmake --build build-gen --target munigen
          mkdir -p regenerated
          ./build-gen/munigen tools/ucd regenerated | tee table-sizes.txt
          diff -r src/generated regenerated
      - name: Tables within their ceilings
        run: python3 tools/table_budget.py table-sizes.txt
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -D${PREFIX}_HARFBUZZ=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_UNICODE_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_UNICODE_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_UNICODE_BUILD_SHARED=ON" }
          - { name: linux-harfbuzz,      os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_UNICODE_HARFBUZZ=ON" }
          - { name: linux-minimal,       os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_UNICODE_NORMALIZATION=OFF -DMAUL_UNICODE_CASE=OFF -DMAUL_UNICODE_SECURITY=OFF" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends (llvm-20-dev alone is 50 MB), with
          # the sanitizers' runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 g++-14 ninja-build libharfbuzz-dev pkg-config
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Package
        if: matrix.name == 'linux-harfbuzz' || matrix.name == 'linux-shared'
        run: |
          cmake --install build --prefix "$PWD/package"
          cmake -S samples/minimal -B build-minimal -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_PREFIX_PATH="$PWD/package"
          cmake --build build-minimal
          LD_LIBRARY_PATH="$PWD/package/lib" ./build-minimal/minimal

  # Each fuzz target looks for crashes, broken invariants and answers that
  # disagree with each other or with ICU: briefly on a pull request,
  # longer on main and at night.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 90 }}
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, with libFuzzer's runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build libicu-dev pkg-config
      - name: Build
        # fuzz_icu compares with ICU, a test-only oracle.
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_FUZZ_ICU=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            # Seeds reach inputs random bytes rarely form, like Thai text.
            if [ -d "test/seeds/$(basename $target)" ]; then
              cp test/seeds/"$(basename $target)"/* "corpus-$(basename $target)"/
            fi
            "$target" -max_total_time=$FUZZ_SECONDS -max_len=256 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX: consumers may compile them with it, though it cannot
      # build the library itself.
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Size
        # The static library in total, and each optional component's cost:
        # the library with it less the library without it. Security needs
        # normalization, so normalization is measured with security off.
        run: |
          measure() {
            emcmake cmake -B "build-$1" -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_BUILD_TESTS=OFF \
              -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_TOOLS=OFF "${@:2}" >/dev/null
            cmake --build "build-$1" -j 4 >/dev/null
            stat -c %s "build-$1/libmaul-unicode.a"
          }
          all=$(stat -c %s build/libmaul-unicode.a)
          noSecurity=$(measure no-security -D${PREFIX}_SECURITY=OFF)
          noCase=$(measure no-case -D${PREFIX}_CASE=OFF)
          core=$(measure core -D${PREFIX}_SECURITY=OFF -D${PREFIX}_NORMALIZATION=OFF -D${PREFIX}_CASE=OFF)
          noNormalization=$(measure no-normalization -D${PREFIX}_SECURITY=OFF -D${PREFIX}_NORMALIZATION=OFF)
          echo "library, every component  $all bytes"
          echo "core, no component        $core bytes"
          echo "security                  $((all - noSecurity)) bytes"
          echo "case                      $((all - noCase)) bytes"
          echo "normalization             $((noSecurity - noNormalization)) bytes"

  # The one check the ruleset requires: it passes when every job above
  # passed, so adding or renaming a job never touches the ruleset.
  required:
    name: required
    if: always()
    needs: [docs, checks, build-test, fuzz, windows-clang-cl, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
