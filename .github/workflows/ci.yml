# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer. Each build cell is a CMake
# preset built by the organization's shared workflow; the other jobs run
# in the same CI image. docs/operations/checks.md explains each job, and
# tools/check.sh runs the same presets locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 1 * * *"
  # A dispatch runs the night's checks, its fuzzing included.
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds each fuzz target runs (the night's run is 600)
        type: number
        default: 600

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_UNICODE

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@b6e8a6f50a3c8789f11a06858675374ae2ff90a9 # v0.0.33
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github; tools/ucd holds the Unicode data, kept exactly as published.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@b6e8a6f50a3c8789f11a06858675374ae2ff90a9 # v0.0.33
        with:
          exclude: tools/ucd

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@b6e8a6f50a3c8789f11a06858675374ae2ff90a9 # v0.0.33
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the Unicode data against
  # its hashes, test hygiene and labels, the documentation site, the
  # generated tables and their ceilings, and clang-tidy. It runs on
  # documentation changes too, since the snippet check and the site read
  # docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image cpp.yml uses; --init reaps orphaned processes.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          # An empty list would make clang-format read stdin and pass.
          mapfile -t files < <(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' \
            'bench/*.[ch]' 'samples/*.[ch]')
          echo "${#files[@]} files"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no files to format"; exit 1; }
          clang-format --dry-run -Werror "${files[@]}"
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: Unicode data as published
        run: python3 tools/check_ucd.py
      # Every test registration, in the configurations that add tests: the
      # HarfBuzz suites and the package test, and the shared build's exports
      # test.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          cmake -B out/hygiene -G Ninja -D${PREFIX}_HARFBUZZ=ON -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          cmake -B out/hygiene-shared -G Ninja -D${PREFIX}_BUILD_SHARED=ON -D${PREFIX}_HARFBUZZ=ON \
            >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: Generated tables match the generator
        run: |
          cmake -B out/generator -G Ninja -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/generator --target munigen
          mkdir -p out/regenerated
          ./out/generator/munigen tools/ucd out/regenerated | tee out/table-sizes.txt
          diff -r src/generated out/regenerated
      - name: Tables within their ceilings
        run: python3 tools/table_budget.py out/table-sizes.txt
      - name: clang-tidy
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_HARFBUZZ=ON
          for f in src/*.c; do
            clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*' "$f"
          done

  # Every cell builds with warnings as errors and runs the whole suite, the
  # header tests included; the shared and HarfBuzz cells also install the
  # library and build samples/minimal against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-harfbuzz }
          - { preset: linux-minimal }
          - { preset: linux-i686-gcc-14 }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@b6e8a6f50a3c8789f11a06858675374ae2ff90a9 # v0.0.33
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # Each fuzz target looks for crashes, broken invariants and answers that
  # disagree with each other or with ICU: briefly on a pull request, longer
  # on main, and an extended run at night. Each target's corpus carries over
  # in one cache entry; docs/operations/checks.md says why one job.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 50 || 25 }}
    # The image cpp.yml uses; --init reaps orphaned processes.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || (github.event_name == 'push' && 90 || (inputs.fuzz-seconds || 600)) }}
      # A target's minimized corpus may not pass this, so one target's
      # growth cannot crowd the others out of the cache.
      CORPUS_LIMIT_MB: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        # fuzz_icu compares with ICU, a test-only oracle.
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_FUZZ_ICU=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      # Caches are immutable: each run saves a new entry and the next run
      # restores the latest. Only main reads the corpus, as only main
      # saves it; a pull request or a dispatch on a branch starts from the
      # seeds.
      - name: Restore the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run
        # Four targets at a time, one per core of the runner; each keeps its
        # full time. tools/fuzz_target.sh keeps each target's log, seed
        # and findings on the runner and reports a finding without its
        # input; the reports print once every target has finished.
        #
        # A dispatch's fuzz-seconds must leave time for the minimize and
        # save, or the timeout kills the job and the corpus is lost: the
        # ten targets run in three waves of four, and the night's 50
        # minutes less about 10 for the build, the merge and the save leave
        # 40, so at most 800 seconds a wave. libFuzzer reads a negative
        # time as no limit.
        #
        # An input that runs past 30 seconds is a finding (-timeout). The
        # longest texts, fuzz_bidi_long's 128 KiB, take a few seconds at
        # most, so only work that grows faster than the text gets there.
        run: |
          # At most three digits first: a longer number overflows test.
          if ! [[ "$FUZZ_SECONDS" =~ ^[0-9]{1,3}$ ]] || [ "$FUZZ_SECONDS" -lt 1 ] ||
            [ "$FUZZ_SECONDS" -gt 800 ]; then
            echo "::error::fuzz-seconds must be a whole number from 1 to 800, not $FUZZ_SECONDS"
            exit 1
          fi
          # Seeds reach inputs random bytes rarely form, like Thai text;
          # they join whatever corpus the cache brought.
          for target in out/fuzz/fuzz_*; do
            name=$(basename "$target")
            mkdir -p "out/corpus/$name"
            if [ -d "test/seeds/$name" ]; then
              cp test/seeds/"$name"/* "out/corpus/$name"/
            fi
          done
          rm -rf out/fuzz-reports
          status=0
          printf '%s\n' out/fuzz/fuzz_* |
            xargs -P 4 -I {} sh -c 'tools/fuzz_target.sh "$1" -max_total_time="$FUZZ_SECONDS" -max_len=256 -timeout=30 "out/corpus/$(basename "$1")"' _ {} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      # Each corpus is merged into a fresh directory and swapped in only
      # when the merge finished without a finding, so a failed merge
      # leaves the old corpus and the step fails before the save.
      # tools/fuzz_target.sh --merge keeps the merge's log on the runner,
      # since a merge reruns every input.
      - name: Minimize the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf out/fuzz-reports out/merged
          status=0
          printf '%s\n' out/fuzz/fuzz_* |
            xargs -P 4 -I {} sh -c 'name=$(basename "$1") &&
              tools/fuzz_target.sh --merge "$1" "out/merged/$name" -max_len=256 -timeout=30 "out/corpus/$name" &&
              rm -rf "out/corpus/$name" && mv "out/merged/$name" "out/corpus/$name"' _ {} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          over=0
          {
            echo "| Target | Inputs | MB |"
            echo "|---|---|---|"
            for d in out/corpus/*/; do
              name=$(basename "$d")
              mb=$(du -sm "$d" | cut -f1)
              echo "| $name | $(find "$d" -type f | wc -l) | $mb |"
              if [ "$mb" -gt "$CORPUS_LIMIT_MB" ]; then
                echo "::error::$name: corpus of $mb MB passes $CORPUS_LIMIT_MB MB" >&2
                over=1
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$over"
      - name: Save the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # The library and its tests under Emscripten and Node, and the size of the
  # static library in total and per optional component. The CI image has no
  # Emscripten, so this job uses the runner and the emsdk action.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Configure
        run: emcmake cmake -B out/web -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build out/web -j 4
      - name: Test
        # Every suite but the quarantined ones, which the test presets
        # leave out too; the quarantine job runs them.
        run: |
          quarantined=$(ctest --test-dir out/web -N -L '^quarantine$' | sed -n 's/^ *Test *#[0-9]*: //p')
          for t in out/web/test_*.js; do
            name=$(basename "$t" .js)
            if grep -qx "${name#test_}" <<<"$quarantined"; then
              echo "${name#test_}: quarantined, left to the quarantine job"
              continue
            fi
            node "$t"
          done
      - name: The quarantined tests
        # At night and on a manual run, as the quarantine job runs the
        # native ones, so a suite quarantined here still counts its green
        # nights. tools/run_quarantine.sh's contract under node, with the
        # native job's 300-second limit per suite: a failure or a timeout
        # is a warning and a summary line, and a suite that did not run,
        # skipped itself (exit 77) or hit a WebAssembly memory trap fails
        # the step.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          quarantined=$(ctest --test-dir out/web -N -L '^quarantine$' | sed -n 's/^ *Test *#[0-9]*: //p')
          if [ -z "$quarantined" ]; then
            echo "Quarantined tests in out/web: none." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          for name in $quarantined; do
            t="out/web/test_$name.js"
            if [ ! -f "$t" ]; then
              echo "::error::quarantined test $name was not built"
              status=1
              continue
            fi
            log=$(mktemp)
            rc=0
            timeout 300 node "$t" >"$log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "- \`$name\` passed" >>"$GITHUB_STEP_SUMMARY"
            elif [ "$rc" -eq 77 ]; then
              cat "$log"
              echo "::error::quarantined test $name skipped itself"
              status=1
            elif grep -q -E 'RuntimeError: (memory access out of bounds|null function|index out of bounds)' "$log"; then
              cat "$log"
              echo "::error::quarantined test $name hit a memory trap"
              status=1
            elif [ "$rc" -eq 124 ]; then
              cat "$log"
              echo "::warning::quarantined test $name timed out after 300 seconds"
              echo "- \`$name\` timed out (a known flake; it has an issue)" >>"$GITHUB_STEP_SUMMARY"
            else
              cat "$log"
              echo "::warning::quarantined test $name failed"
              echo "- \`$name\` failed (a known flake; it has an issue)" >>"$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$log"
          done
          exit "$status"
      - name: Size
        # The static library in total, and each optional component's cost:
        # the library with it less the library without it. Security needs
        # normalization, so normalization is measured with security off.
        run: |
          measure() {
            emcmake cmake -B "out/web-$1" -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_BUILD_TESTS=OFF \
              -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_TOOLS=OFF "${@:2}" >/dev/null
            cmake --build "out/web-$1" -j 4 >/dev/null
            stat -c %s "out/web-$1/libmaul-unicode.a"
          }
          all=$(stat -c %s out/web/libmaul-unicode.a)
          noSecurity=$(measure no-security -D${PREFIX}_SECURITY=OFF)
          noCase=$(measure no-case -D${PREFIX}_CASE=OFF)
          core=$(measure core -D${PREFIX}_SECURITY=OFF -D${PREFIX}_NORMALIZATION=OFF -D${PREFIX}_CASE=OFF)
          noNormalization=$(measure no-normalization -D${PREFIX}_SECURITY=OFF -D${PREFIX}_NORMALIZATION=OFF)
          echo "library, every component  $all bytes"
          echo "core, no component        $core bytes"
          echo "security                  $((all - noSecurity)) bytes"
          echo "case                      $((all - noCase)) bytes"
          echo "normalization             $((noSecurity - noNormalization)) bytes"

  # The quarantined tests (docs/operations/checks.md#quarantine), which the
  # test presets leave out, under AddressSanitizer and UBSan: at night and
  # on a manual run. A known flake's failure is a warning; a test that did
  # not run, a sanitizer report or a crash fails the job. The timeout and
  # jobs are the test presets' own.
  quarantine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # A PID 1 that reaps orphans, as cpp.yml's container has.
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20-asan
          cmake --build --preset linux-clang-20-asan
      - name: The quarantined tests
        run: tools/run_quarantine.sh out/linux-clang-20-asan --timeout 300 -j 4

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, quarantine, fuzz, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
