# CodeQL on every pull request and on main. An advanced setup, since the
# default one builds with the runner's default compiler, GCC 13, and the
# library needs GCC 14 for C23 (cmake/CompilerFlags.cmake refuses older).
# It builds in the CI image, whose HarfBuzz lets it analyze the HarfBuzz
# functions too.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 8 * * 1"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        # The library with every component and the HarfBuzz functions, the
        # generator, the tests and the samples: the CI cell of that name.
        run: |
          cmake --preset linux-harfbuzz
          cmake --build --preset linux-harfbuzz
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
